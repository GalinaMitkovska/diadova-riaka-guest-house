{% extends 'home.html' %}
{% load static %}

{% block content %}
<div style="max-width: 600px; margin: 40px auto; background: rgba(30, 41, 59, 0.85); padding: 30px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); color: #fff; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);">
    <h2 style="color: #f59e0b; margin-bottom: 20px; border-bottom: 2px solid rgba(245, 158, 11, 0.3); padding-bottom: 8px;">{{ title }}</h2>

    <form method="POST" style="background: transparent; border: none; padding: 0; margin: 0;">
        {% csrf_token %}

        <style>
            p {
                background: transparent !important;
                color: #f1f5f9 !important;
                margin-bottom: 15px;
            }
            label {
                color: #cbd5e1 !important;
                font-weight: 500;
                display: block;
                margin-bottom: 5px;
            }
            input[type="text"],
            input[type="number"],
            input[type="date"],
            input[type="email"],
            input[type="password"],
            select,
            textarea {
                background: rgba(15, 23, 42, 0.85) !important;
                color: #ffffff !important;
                border: 1px solid rgba(255, 255, 255, 0.2) !important;
                border-radius: 8px !important;
                padding: 10px 14px !important;
                width: 100% !important;
                box-sizing: border-box !important;
                outline: none !important;
            }
            input:focus, select:focus, textarea:focus {
                border-color: #f59e0b !important;
                box-shadow: 0 0 10px rgba(245, 158, 11, 0.4) !important;
            }
        </style>

        {{ form.as_p }}

        <button type="submit" style="padding: 12px 20px; background: #f59e0b; color: #0f172a; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 15px; transition: all 0.3s ease;">Запази</button>
    </form>

    <br>
    <a href="{% url 'room_list' %}" style="color: #94a3b8; text-decoration: none; font-size: 0.9rem;">&larr; Назад към списъка със стай</a>
</div>
{% endblock %}
