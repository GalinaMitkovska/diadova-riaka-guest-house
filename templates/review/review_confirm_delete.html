{% extends 'home.html' %}
{% load static %}

{% block content %}
<div style="max-width: 500px; margin: 40px auto; background: rgba(30, 41, 59, 0.85); padding: 30px; border-radius: 12px; border: 1px solid rgba(239, 68, 68, 0.4); backdrop-filter: blur(10px); color: #fff; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); overflow: hidden;">

    <h3 style="color: #ef4444; margin-top: 0; margin-bottom: 20px; border-bottom: 2px solid rgba(239, 68, 68, 0.3); padding-bottom: 10px; font-size: 1.5rem;">
        Потвърждение за изтриване
    </h3>

    <p style="margin: 0 0 25px 0; color: #cbd5e1; font-size: 1.05rem; line-height: 1.5; background: transparent !important; padding: 0;">
        Сигурни ли сте, че искате да изтриете този отзив от <strong>{{ object.name }}</strong>?
    </p>

    <form method="post" style="margin: 0; padding: 0; background: transparent; border: none;">
        {% csrf_token %}
        <div style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
            <button type="submit" style="background-color: #ef4444; color: #ffffff; padding: 10px 22px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: all 0.3s ease;">
                Да, изтрий
            </button>
            <a href="{% url 'review_list' %}" style="background-color: rgba(255, 255, 255, 0.1); color: #ffffff; padding: 10px 22px; border-radius: 8px; text-decoration: none; font-weight: 600; border: 1px solid rgba(255, 255, 255, 0.2); display: inline-block;">
                Отказ
            </a>
        </div>
    </form>
</div>
{% endblock %}
